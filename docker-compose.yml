services:
  library:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "8001:8001"
    volumes:
      - ./:/app
    command: >
      sh -c "python manage.py test && python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8001"
    depends_on:
      - db




  db:
    image: postgres:16.0-alpine3.17
    restart: always
    env_file:
      - .env
    volumes:
      - my_db:$PGDATA


volumes:
  my_db: